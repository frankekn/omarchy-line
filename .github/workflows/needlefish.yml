name: needlefish
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
  workflow_call:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number
    secrets:
      CODEX_PROXY_API_KEY:
        description: CLIProxyAPI credential for the review lane
        required: true

concurrency:
  group: needlefish-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: x64-review
    timeout-minutes: 75
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install GitHub CLI
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          if [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
            echo "RUNNER_TOOL_CACHE must be set and non-empty before installing GitHub CLI" >&2
            exit 1
          fi
          case "$(uname -m)" in
            x86_64) gh_arch=amd64 ;;
            aarch64|arm64) gh_arch=arm64 ;;
            *) echo "unsupported gh architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          gh_tag=$(node -e 'fetch("https://api.github.com/repos/cli/cli/releases/latest").then((r) => r.json()).then((j) => process.stdout.write(j.tag_name))')
          gh_version="${gh_tag#v}"
          gh_root="$RUNNER_TOOL_CACHE/gh"
          mkdir -p "$gh_root"
          curl -fsSL "https://github.com/cli/cli/releases/download/${gh_tag}/gh_${gh_version}_linux_${gh_arch}.tar.gz" -o "$gh_root/gh.tar.gz"
          tar -xzf "$gh_root/gh.tar.gz" -C "$gh_root"
          echo "$gh_root/gh_${gh_version}_linux_${gh_arch}/bin" >> "$GITHUB_PATH"
          export PATH="$gh_root/gh_${gh_version}_linux_${gh_arch}/bin:$PATH"
          gh --version

      - name: Resolve PR refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ -n "$EVENT_HEAD" ]; then
            {
              echo "head=$EVENT_HEAD"
              echo "base=$EVENT_BASE"
              echo "repo=$EVENT_HEAD_REPO"
              echo "skip=false"
            } >> "$GITHUB_OUTPUT"
          else
            state=$(gh pr view "$PR_NUM" -R "$REPO" --json state -q .state)
            head_sha=$(gh pr view "$PR_NUM" -R "$REPO" --json headRefOid -q .headRefOid)
            base_sha=$(gh pr view "$PR_NUM" -R "$REPO" --json baseRefOid -q .baseRefOid)
            head_repo=$(gh pr view "$PR_NUM" -R "$REPO" --json headRepository -q .headRepository.nameWithOwner)
            if [ "$state" != "OPEN" ] || [ "$head_repo" != "$REPO" ]; then
              {
                echo "skip=true"
                echo "reason=state=$state head_repo=$head_repo"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "head=$head_sha"
              echo "base=$base_sha"
              echo "repo=$head_repo"
              echo "skip=false"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Report skipped PR
        if: steps.refs.outputs.skip == 'true'
        run: |
          echo "Skipping Needlefish review: ${{ steps.refs.outputs.reason }}"

      - name: Prepare Needlefish temp directory
        if: steps.refs.outputs.skip != 'true'
        run: |
          set -euo pipefail
          needlefish_temp="$RUNNER_TEMP/needlefish"
          mkdir -p "$needlefish_temp"

          filesystem_type=$(df -PT "$needlefish_temp" | awk 'NR == 2 { print $2 }')
          case "$filesystem_type" in
            "")
              echo "Needlefish temp preflight expected a non-empty filesystem type at $needlefish_temp" >&2
              exit 1
              ;;
            tmpfs|ramfs|devtmpfs)
              echo "Needlefish temp preflight rejects RAM-backed filesystem '$filesystem_type' at $needlefish_temp; move RUNNER_TEMP to a disk-backed filesystem" >&2
              exit 1
              ;;
          esac
          if [[ ! "$filesystem_type" =~ ^[[:alnum:]_.+-]+$ ]]; then
            echo "Needlefish temp preflight expected a parseable filesystem type; found '$filesystem_type' at $needlefish_temp" >&2
            exit 1
          fi

          available_kib=$(df -Pk "$needlefish_temp" | awk 'NR == 2 { print $4 }')
          if [[ ! "$available_kib" =~ ^[0-9]+$ ]]; then
            echo "Needlefish temp preflight expected numeric available KiB; found '${available_kib:-<empty>}' at $needlefish_temp" >&2
            exit 1
          fi
          if (( available_kib < 2097152 )); then
            echo "Needlefish temp preflight requires at least 2 GiB available; found ${available_kib} KiB at $needlefish_temp" >&2
            exit 1
          fi

          inode_df=$(df -Pi "$needlefish_temp")
          read -r inode_total inode_available <<< "$(awk 'NR == 2 { print $2, $4 }' <<< "$inode_df")"
          if [[ ! "$inode_total" =~ ^[0-9]+$ ]]; then
            echo "Needlefish temp preflight expected numeric inode total; found '${inode_total:-<empty>}' at $needlefish_temp" >&2
            exit 1
          fi
          if [[ ! "$inode_available" =~ ^[0-9]+$ ]]; then
            echo "Needlefish temp preflight expected numeric available inodes; found '${inode_available:-<empty>}' at $needlefish_temp" >&2
            exit 1
          fi
          if (( inode_total == 0 )); then
            echo "Needlefish temp preflight is skipping the inode percentage check because inode accounting is unavailable at $needlefish_temp"
          else
            inode_free_percent=$((inode_available * 100 / inode_total))
            if (( inode_free_percent < 10 )); then
              echo "Needlefish temp preflight requires at least 10% inodes free; found ${inode_free_percent}% at $needlefish_temp" >&2
              exit 1
            fi
          fi

          {
            echo "TMPDIR=$needlefish_temp"
            echo "NEEDLEFISH_TMPDIR=$needlefish_temp"
          } >> "$GITHUB_ENV"

      - name: Checkout review target
        if: steps.refs.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.refs.outputs.repo }}
          ref: ${{ steps.refs.outputs.head }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Verify review proxy lane
        if: steps.refs.outputs.skip != 'true'
        env:
          CODEX_PROXY_BASE_URL: ${{ vars.CODEX_PROXY_BASE_URL }}
          CODEX_PROXY_API_KEY: ${{ secrets.CODEX_PROXY_API_KEY }}
        run: |
          set -euo pipefail
          command -v codex
          codex --version
          test -n "${CODEX_PROXY_BASE_URL:-}"
          curl -fsS -o /dev/null -H "Authorization: Bearer $CODEX_PROXY_API_KEY" "$CODEX_PROXY_BASE_URL/models"

      - name: Select self-managed Needlefish
        if: steps.refs.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail

          report_release_failure() {
            title="$1"
            summary="$2"
            gh api -X POST "repos/$REPO/check-runs" \
              -f name="Needlefish" \
              -f head_sha="$PR_HEAD_SHA" \
              -f status="completed" \
              -f conclusion="failure" \
              -f "output[title]=$title" \
              -f "output[summary]=$summary"
            echo "$summary" >&2
            exit 1
          }

          root="$HOME/.local/share/needlefish-self"
          release="$(node -e 'process.stdout.write(require("node:fs").realpathSync(process.argv[1]))' "$root/current")" || {
            report_release_failure "Needlefish self install missing" "Install the self-managed Needlefish bundle on this runner before retrying."
          }
          case "$release" in
            "$root/releases/"*) ;;
            *) report_release_failure "Invalid Needlefish self install" "The self-managed current link must select a release under $root/releases." ;;
          esac
          metadata="$release/release.json"
          binary="$release/bin/needlefish"
          if ! node - "$metadata" "$release" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const [metadataPath, release] = process.argv.slice(2);
          const metadata = JSON.parse(fs.readFileSync(metadataPath, "utf8"));
          const sha256 = file => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          if (metadata.self_version !== path.basename(release) ||
              metadata.review_timeout_env !== "NEEDLEFISH_REVIEW_TIMEOUT_MS" ||
              !/^[0-9a-f]{40}$/.test(metadata.base_sha) ||
              !/^[0-9a-f]{64}$/.test(metadata.patch_sha256) ||
              metadata.patch_sha256 !== sha256(path.join(release, "self-managed.patch")) ||
              metadata.dependency_lock_sha256 !== sha256(path.join(release, "pnpm-lock.yaml"))) {
            process.exit(1);
          }
          NODE
          then
            report_release_failure "Invalid Needlefish self install metadata" "Self-managed release metadata or patch/lockfile digest does not match $release."
          fi
          if [ ! -x "$binary" ] || ! "$binary" --version; then
            report_release_failure "Needlefish self install is not runnable" "The installed executable is unavailable at $binary."
          fi

          printf 'NEEDLEFISH_BIN=%s\n' "$binary" >> "$GITHUB_ENV"

      - name: Save review identity
        if: steps.refs.outputs.skip != 'true'
        env:
          REVIEW_HEAD: ${{ steps.refs.outputs.head }}
        run: |
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/needlefish-identity.json", JSON.stringify({run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT, head_sha: process.env.REVIEW_HEAD}))'

      - name: Publish review identity
        if: steps.refs.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: needlefish-identity-${{ github.run_attempt }}
          path: ${{ runner.temp }}/needlefish-identity.json
          if-no-files-found: error
          retention-days: 7

      - name: Needlefish review
        if: steps.refs.outputs.skip != 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ steps.refs.outputs.base }}
          PR_HEAD_SHA: ${{ steps.refs.outputs.head }}
          PR_NUM: ${{ github.event.pull_request.number || inputs.pr_number }}
          CODEX_PROXY_BASE_URL: ${{ vars.CODEX_PROXY_BASE_URL }}
          CODEX_PROXY_API_KEY: ${{ secrets.CODEX_PROXY_API_KEY }}
          NEEDLEFISH_CODEX_PROXY_REQUIRED: "1"
          NEEDLEFISH_MODEL: deepseek/deepseek-v4.1-flash
          CODEX_REASONING_EFFORT: high
          NEEDLEFISH_EPHEMERAL_HOME: "1"
          NEEDLEFISH_RUNNER_ENV_PASSTHROUGH: PR_BASE_SHA,PR_HEAD_SHA
          NEEDLEFISH_TIMEOUT_MS: "1200000"
          NEEDLEFISH_REVIEW_TIMEOUT_MS: "3300000"
          NEEDLEFISH_NO_RETRY: "1"
          NEEDLEFISH_MODEL_FALLBACKS: ${{ vars.NEEDLEFISH_MODEL_FALLBACKS || 'devin/deepseek-v4-1-flash,deepseek-v4.1-flash' }}
          NEEDLEFISH_RECHECK: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          recheck=()
          if [ -n "${NEEDLEFISH_RECHECK:-}" ]; then recheck=(--recheck); fi
          case "$PR_NUM" in
            ''|*[!0-9]*)
              echo "invalid PR_NUM: $PR_NUM" >&2
              exit 1
              ;;
          esac
          timeout_args=(--signal=TERM --kill-after=30s 60m)
          chain_budget_s=3600
          attempt_floor_s=600
          chain_started_at=$SECONDS
          args=(--runner codex --model deepseek/deepseek-v4.1-flash --github --pr "$PR_NUM" "${recheck[@]}")
          base_args=("${args[@]}")
          chain=()
          if [ -n "${CODEX_PROXY_BASE_URL:-}" ] && [ "${NEEDLEFISH_MODEL_FALLBACKS:-}" != "none" ]; then
            IFS=',' read -r -a chain <<< "${NEEDLEFISH_MODEL_FALLBACKS:-}"
          fi
          out=""
          run_review() {
            local model="$1" i rc remaining
            local -a attempt_args
            args=("${base_args[@]}")
            if [ -n "$model" ]; then
              for i in "${!args[@]}"; do
                if [ "${args[$i]}" = "--model" ]; then args[i + 1]="$model"; fi
              done
            fi
            attempt_args=("${timeout_args[@]}")
            remaining=$((chain_budget_s - (SECONDS - chain_started_at)))
            if [ "$remaining" -lt "$chain_budget_s" ]; then
              attempt_args=("${timeout_args[@]:0:2}" "${remaining}s")
            fi
            set +e
            out=$(timeout "${attempt_args[@]}" "$NEEDLEFISH_BIN" "${args[@]}" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            return $rc
          }
          review_infra_failed() {
            tail -c 4000 <<<"$out" | grep 'needlefish review failed:' | tail -1 \
              | grep -qE 'likely cause: (usage limit|rate limited|network error|empty output|truncated output|html error page)($|;)'
          }
          if run_review ""; then exit 0; else rc=$?; fi
          for next in "${chain[@]}"; do
            [ -n "$next" ] || continue
            if ! review_infra_failed; then
              echo "needlefish: previous failure is not infra-class; not switching provider" >&2
              break
            fi
            remaining=$((chain_budget_s - (SECONDS - chain_started_at)))
            if [ "$remaining" -lt "$attempt_floor_s" ]; then
              echo "needlefish: ${remaining}s left of the shared ${chain_budget_s}s budget is under the ${attempt_floor_s}s floor; not switching provider" >&2
              break
            fi
            echo "::warning title=Needlefish provider fallback::switching lane to $next after an infra failure on the previous provider"
            if run_review "$next"; then
              echo "lane=fallback:$next" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 0
            else
              rc=$?
            fi
          done
          if [ "$rc" -gt 128 ] && kill -l "$((rc - 128))" >/dev/null 2>&1; then
            kill -s "$((rc - 128))" $$
          fi
          exit $rc
