name: Needlefish finalization

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Needlefish workflow run ID to recover
        required: true
        type: string
      run_attempt:
        description: Original workflow run attempt
        required: true
        type: string
      head_sha:
        description: Exact reviewed PR head SHA
        required: true
        type: string
  workflow_run:
    workflows: [needlefish]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  finalize:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: x64-ci
    timeout-minutes: 5
    steps:
      - name: Checkout trusted finalizer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Find review identity
        if: github.event_name == 'workflow_run'
        id: identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100
            });
            const matches = artifacts.filter(a => a.name === `needlefish-identity-${run.run_attempt}`);
            if (matches.length === 0) {
              core.info('No identity published: review did not start under this protocol.');
              return;
            }
            if (matches.length !== 1 || matches[0].expired) throw new Error('Review identity unavailable');
            core.setOutput('artifact_id', matches[0].id);

      - name: Download review identity
        if: steps.identity.outputs.artifact_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.identity.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/needlefish-identity
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Finalize interrupted review
        if: steps.identity.outputs.artifact_id != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const finalize = require('./.github/scripts/needlefish-finalize.cjs');
            const identity = finalize.readIdentity(`${process.env.RUNNER_TEMP}/needlefish-identity/needlefish-identity.json`);
            await finalize({github, context, identity});

      - name: Recover historical interrupted review
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const finalize = require('./.github/scripts/needlefish-finalize.cjs');
            await finalize.recover({github, context, inputs: context.payload.inputs});
