name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - name: daemon checks
        working-directory: daemon
        run: |
          deno task check
          deno task no-any
          deno task lint
          deno task fmt
          deno task test
      - name: cli checks
        working-directory: cli
        run: |
          deno task check
          deno task no-any
          deno task lint
          deno task fmt
          deno task test
      - name: qml harness
        run: node tests/qml/run.js
      - name: stub tests
        working-directory: daemon
        run: python3 stub_test.py
