name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Install check dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qt6-declarative-dev qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: daemon checks
        working-directory: daemon
        run: |
          deno task check
          deno task no-any
          deno task lint
          deno task fmt
          deno task test
      - name: qml harness
        run: node tests/qml/run.js
      - name: review finalizer tests
        run: node --test .github/scripts/needlefish-finalize.test.cjs
      - name: qml key tests
        # qmltestrunner ships in /usr/lib/qt6/bin, which is not on PATH; the
        # runner script probes for it by name, so extend PATH for the call.
        run: PATH="/usr/lib/qt6/bin:$PATH" tests/qml/keytest/run.sh
      - name: stub tests
        working-directory: daemon
        run: python3 stub_test.py
      - name: shell syntax
        run: sh -n daemon/enil-run.sh
      - name: manifest sanity
        run: node -e 'const m = require("./manifest.json"); for (const k of ["id", "name", "version"]) if (!m[k]) throw new Error("manifest.json missing " + k)'
