name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: denoland/setup-deno@v2
      - name: daemon checks
        working-directory: daemon
        run: |
          deno task check
          deno task no-any
          deno task lint
          deno task fmt
          deno task test
      - name: qml harness
        run: node tests/qml/run.js
      - name: qml key tests
        # qmltestrunner ships in /usr/lib/qt6/bin, which is not on PATH; the
        # runner script probes for it by name, so extend PATH for the call.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
          PATH="/usr/lib/qt6/bin:$PATH" tests/qml/keytest/run.sh
      - name: stub tests
        working-directory: daemon
        run: python3 stub_test.py
      - name: shell syntax
        run: sh -n daemon/enil-run.sh
      - name: manifest sanity
        run: node -e 'const m = require("./manifest.json"); for (const k of ["id", "name", "version"]) if (!m[k]) throw new Error("manifest.json missing " + k)'
