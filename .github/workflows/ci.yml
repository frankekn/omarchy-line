name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: x64-ci
    container: ubuntu:24.04
    steps:
      - name: Install check dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates curl git unzip python3 util-linux qt6-declarative-dev qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
          useradd --create-home ci
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
      - name: daemon checks
        working-directory: daemon
        # Permission-failure tests need a normal user; container root ignores chmod.
        run: |
          runuser -u ci -- sh -c '
            set -e
            deno task check
            deno task no-any
            deno task lint
            deno task fmt
            deno task test
          '
      - name: qml harness
        run: node tests/qml/run.js
      - name: review finalizer tests
        run: node --test .github/scripts/needlefish-finalize.test.cjs
      - name: qml key tests
        # qmltestrunner ships in /usr/lib/qt6/bin, which is not on PATH; the
        # runner script probes for it by name, so extend PATH for the call.
        run: PATH="/usr/lib/qt6/bin:$PATH" tests/qml/keytest/run.sh
      - name: stub tests
        working-directory: daemon
        run: runuser -u ci -- python3 stub_test.py
      - name: shell syntax
        run: sh -n daemon/enil-run.sh
      - name: manifest sanity
        run: node -e 'const m = require("./manifest.json"); for (const k of ["id", "name", "version"]) if (!m[k]) throw new Error("manifest.json missing " + k)'
